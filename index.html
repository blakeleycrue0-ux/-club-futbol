<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unirse - Santa Ponsa</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:white;
}

/* fondo lila */
body::before{
    content:'';
    position:absolute;
    width:800px;
    height:800px;
    background:linear-gradient(135deg,#e9d5ff,#c084fc,#a855f7);
    border-radius:50%;
    top:-250px;
    left:-250px;
    opacity:0.9;
}

.box{
    position:relative;
    z-index:2;
    background:white;
    padding:50px;
    border-radius:20px;
    box-shadow:0 10px 40px rgba(0,0,0,0.1);
    text-align:center;
    width:320px;
}

.box img{
    height:60px;
    margin-bottom:20px;
}

h1{
    font-size:26px;
    margin-bottom:10px;
}

p{
    color:#666;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#9333ea;
    color:white;
    font-weight:600;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="box">

    <img src="Logoclub.png">

    <h1>Santa Ponsa Femenino</h1>
    <p>Accede al club</p>

    <input id="name" placeholder="Tu nombre">

    <button onclick="login()">Entrar</button>

</div>

<script>

function login(){

    let name = document.getElementById("name").value;

    if(!name){
        alert("Escribe tu nombre");
        return;
    }

    localStorage.setItem("user", name);

    window.location.href = "home.html";
}

</script>

</body>
</html>
